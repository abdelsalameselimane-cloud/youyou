<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة REQ</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#12151c;--mu:#6a7282;--bd:#e5e8ee;--in:#f1f3f8;--pr:#4f6bff;--pr2:#7c5cff;--ok:#15803d;--er:#dc2626;--sh:0 1px 2px rgba(18,21,28,.04),0 6px 20px rgba(18,21,28,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#9aa3b5;--bd:#262c3a;--in:#1b2030;--pr:#6580ff;--pr2:#8e74ff;--ok:#34d399;--er:#f87171;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#9aa3b5;--bd:#262c3a;--in:#1b2030;--pr:#6580ff;--pr2:#8e74ff;--ok:#34d399;--er:#f87171;--sh:none;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Tahoma,Roboto,"Noto Sans Arabic",Arial,sans-serif;direction:ltr;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.t{unicode-bidi:plaintext;text-align:start}.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:14px;padding:20px 0}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:26px;height:26px}
.grow{flex:1;min-width:0}
h1{margin:0;font-size:18.4px;line-height:1.4;word-break:break-word}
.mu{color:var(--mu)}.sm{font-size:13.6px}.xs{font-size:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:14px}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--pr)) 13%,transparent);color:var(--c,var(--pr))}
.card h2{margin:0;font-size:16.8px;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:700;width:100%;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(.97)}
.btn.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}.btn.p:hover{filter:brightness(1.08)}
.btn.d{background:var(--er);color:#fff;border:0}
.btn:disabled{opacity:.55;cursor:default}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--mu);flex:none}
.ib:hover{background:var(--in);color:var(--tx)}
.chip{min-height:36px;padding:0 16px;border-radius:50px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13.6px}
.chip.on{background:color-mix(in srgb,var(--pr) 13%,transparent);border-color:var(--pr);color:var(--pr);font-weight:700}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:10px;background:var(--in);border:1px solid var(--bd);border-radius:13px;padding:0 14px;min-height:48px}
.field:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;min-height:44px;unicode-bidi:plaintext}
.ban{display:flex;gap:14px;align-items:flex-start;border-radius:16px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.ban>svg{color:var(--c);margin-top:2px}.ban b{display:block;line-height:1.5}.ban .btn{margin-top:10px;width:auto;min-height:40px}
.spin{width:20px;height:20px;border:2.5px solid color-mix(in srgb,var(--pr) 25%,transparent);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite;flex:none;margin-top:2px}
.btn .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff;margin:0}
@keyframes sp{to{transform:rotate(360deg)}}
.stack{display:flex;flex-direction:column;gap:14px}
.home{display:grid;gap:16px;max-width:900px;margin:0 auto}
.drop{margin-top:18px;border:2px dashed var(--bd);border-radius:16px;padding:22px 16px;text-align:center;color:var(--mu);transition:.15s}
.drop.over{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,transparent);color:var(--pr)}
.drop .btn{margin-top:12px}
.dc{cursor:pointer}.dc:hover{border-color:var(--pr)}
.dn{font-weight:700;word-break:break-word;unicode-bidi:plaintext;text-align:start;line-height:1.5}
.big{font-size:34px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
hr{border:0;height:1px;background:var(--bd);margin:16px 0;width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:16.8px}
.res{display:grid;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.ent .eq{font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:50px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fi .15s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto;animation:su .2s}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(30px);opacity:0}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.raw{max-height:120px;overflow:auto;background:var(--in);border:1px solid var(--bd);border-radius:13px;padding:10px;font:12px/18px ui-monospace,Consolas,monospace;color:var(--mu);white-space:pre-wrap;margin:0}
.lang{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:8px 14px;border-radius:13px;border:1px solid var(--bd);background:transparent;cursor:pointer;width:100%;text-align:start}
.lang.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:50px;z-index:30;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{text-align:center;grid-column:1/-1}
@media (min-width:720px){
 .wrap{padding:0 32px 56px}header{padding:28px 0}h1{font-size:22px}
 .ov{align-items:center}.sheet{border-radius:24px;padding:26px}
 .card{padding:22px}.big{font-size:40px}
}
@media (min-width:980px){
 .res{grid-template-columns:360px 1fr;gap:24px}
 .side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
 .tools{display:flex;gap:12px;align-items:center}.tools .field{flex:1}
}
@media (max-width:979px){.tools .chips{margin-top:10px}}
.av{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-weight:700;overflow:hidden;padding:0;border-radius:50%}.av img{width:100%;height:100%;object-fit:cover}
.who{display:flex;align-items:center;gap:14px}.who .av{width:48px;height:48px;cursor:default}
</style>

// ── Engine (port of Engine.kt) ──
const SEP='\\s*[-–—,;|]\\s*';
const R={ESC:/\x1B\[[0-9;]*[A-Za-z]|\x1B[()][0-9A-Za-z]|\x1B[A-Za-z]\d*|[\x00-\x08\x0B\x0C\x0E-\x1F]/g,REQ:/REQ\s*:\s*([\d.,]+)/,
FOUR:new RegExp('^\\s*(\\d+)'+SEP+'(\\d+)'+SEP+'(\\d+)'+SEP+'(\\d+)\\s*$'),ANY:new RegExp('^\\s*\\d+('+SEP+'\\d+)+\\s*$'),
HEADER:/^\s*(\d+)\s+\d\d\/\d\d\/\d\d/,TIME:/^\s*(\d\d:\d\d:\d\d)\s+[A-Z ]+?\s*$/,RC:/\bRC\s+(\d{3})\b/,NP:/NOTES PRESENTED ([\d,]+)/};
const sum=a=>a.reduce((x,y)=>x+y,0);
function clean(t){return t.replace(R.ESC,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))}
function parse(input){
 const l=clean(input).split('\n'),idx=[];l.forEach((s,i)=>{if(R.REQ.test(s))idx.push(i)});
 const seen=new Set(),out=[];
 idx.forEach((i,k)=>{
  const end=Math.min(k+1<idx.length?idx[k+1]:l.length,i+14);
  let ref='REQ '+String(k+1).padStart(3,'0'),time='';
  for(let j=i-1;j>=Math.max(0,i-4);j--){const h=R.HEADER.exec(l[j]);if(h){ref=h[1];break}const t=R.TIME.exec(l[j]);if(t)time=t[1]}
  let a=Number(R.REQ.exec(l[i])[1].replace(/,/g,'').replace(/\.+$/,''));if(isNaN(a))a=0;
  let nums=[],bad='';
  for(let j=i+1;j<Math.min(end,i+4);j++){if(!l[j].trim())continue;const m=R.FOUR.exec(l[j]);
   if(m)nums=m.slice(1,5).map(Number);else if(R.ANY.test(l[j]))bad=l[j].trim();break}
  const raw=l.slice(i,end).join('\n').trim(),rc=(R.RC.exec(raw)||[])[1];
  let status,note='',code='',arg='';
  if(nums.length==4){status='VALID';const np=R.NP.exec(raw);
   if(np&&sum(np[1].split(',').map(x=>parseInt(x)||0))!=sum(nums)){status='VERIFY';note='Sum differs from NOTES PRESENTED';code='SUM'}}
  else if(bad){status='VERIFY';note='Expected 4 numbers: '+bad;code='BAD';arg=bad}
  else if(a==0||rc){status='NO_DISPENSE';note=rc?'Declined RC '+rc:'No cash';code=rc?'DECLINED':'NOCASH';arg=rc||''}
  else{status='VERIFY';note='REQ > 0 but no four-number line';code='NOLINE'}
  const key=[ref,time,a,nums.join('-')].join('|');
  if(!seen.has(key)){seen.add(key);out.push({ref,time,req:a,numbers:nums,total:sum(nums),status,note,raw,code,arg})}
 });return out}
const summarize=e=>({detected:e.length,valid:e.filter(x=>x.status=='VALID').length,verify:e.filter(x=>x.status=='VERIFY').length,noDispense:e.filter(x=>x.status=='NO_DISPENSE').length,grand:sum(e.filter(x=>x.status=='VALID').map(x=>x.total))});
const edit=(e,n)=>({...e,numbers:n,total:sum(n),status:n.length==4?'VALID':'VERIFY',note:'Edited',code:'EDITED',arg:''});

  try{const b=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));

   if(!p.length){skipped.push(f.name);continue}
   const d={id:uid(),name:uniqName(f.name),ts:Date.now(),entries:p};S.docs.push(d);ok++;last=d}
  catch(e){failed++;skipped.push(f.name)}}

 else if(el.classList.contains('n')){el.value=el.value.replace(/\D/g,'').slice(0,7);const e=$('#err');e&&(e.hidden=true)}});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'&&S.sheet){S.sheet=null;render()}
 else if(ev.key=='Enter'&&S.sheet=='edit'&&ev.target.classList.contains('n'))saveEdit();
 else if((ev.key=='Enter'||ev.key==' ')&&ev.target.dataset&&ev.target.dataset.a=='open'){ev.preventDefault();openDoc(ev.target.dataset.id)}});
$('#file').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)readFiles(fs)});
['dragover','dragenter'].forEach(n=>document.addEventListener(n,e=>{if(S.screen==0&&$('#drop')){e.preventDefault();$('#drop').classList.add('over')}}));
['dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{const d=$('#drop');d&&d.classList.remove('over')}));
document.addEventListener('drop',e=>{if(S.screen==0&&$('#drop')){e.preventDefault();const fs=e.dataTransfer.files;if(fs&&fs.length)readFiles(fs)}});
window.addEventListener('hashchange',()=>{const n=location.hash=='#results'&&S.entries.length?1:0;if(n!=S.screen){S.screen=n;render()}});
if(location.hash=='#results'&&S.entries.length)S.screen=1;
// ── Cloud sync (Firebase) — one set of documents per account ──
function pack(){return JSON.stringify({v:2,docs:S.docs,del:S.del})}
function unpack(json,ts){try{const p=JSON.parse(json);
 if(Array.isArray(p))return{docs:p.length?[{id:'legacy',name:t('prev_doc'),ts:ts||1,entries:p}]:[],del:{}};
 return{docs:(p.docs||[]).filter(x=>x&&x.id&&Array.isArray(x.entries)),del:p.del||{}}}catch(e){return{docs:[],del:{}}}}
function merge(a,b){const del={...a.del};for(const k in b.del)del[k]=Math.max(del[k]||0,b.del[k]);
 const m={};[...a.docs,...b.docs].forEach(d=>{if(!m[d.id]||d.ts>m[d.id].ts)m[d.id]=d});
 return{docs:Object.values(m).filter(d=>!(del[d.id]>=d.ts)),del}}
function push(){if(!S.user||!window.FB)return;clearTimeout(pt);pt=setTimeout(async()=>{try{await FB.save(S.user.uid,TS,pack())}catch(e){toast('sync_err')}},800)}
async function login(){try{await FB.login()}catch(e){if(!e||(e.code!='auth/popup-closed-by-user'&&e.code!='auth/cancelled-popup-request'))toast('login_err')}}
async function logout(){clearTimeout(pt);try{await FB.logout()}catch(e){}
 S.docs=[];S.del={};S.cur=null;S.entries=[];TS=0;['docs','del','cur','uid','entries'].forEach(sdel);sset('ts','0');
 S.sheet=null;S.q='';S.dq='';S.onlyV=false;go(0)}
function fbInit(){S.fb=true;FB.onUser(async u=>{S.user=u?{uid:u.uid,name:u.displayName||'',email:u.email||'',photo:u.photo||u.photoURL||''}:null;render();if(!u)return;
 // documents of another account must never mix into this one
 const prev=sget('uid');
 if(prev&&prev!=u.uid){S.docs=[];S.del={};S.cur=null;S.entries=[];sdel('cur');S.screen=0}
 sset('uid',u.uid);
 try{const c=await FB.load(u.uid),remote=c?unpack(c.json,c.ts):{docs:[],del:{}};
  const m=merge({docs:S.docs,del:S.del},remote);
  S.docs=m.docs;S.del=m.del;
  const cd=curDoc();if(cd){S.entries=cd.entries}else{S.cur=null;S.entries=[];S.screen=0}
  const needPush=JSON.stringify(merge(remote,{docs:[],del:{}}).docs.map(d=>d.id+':'+d.ts).sort())!=JSON.stringify(S.docs.map(d=>d.id+':'+d.ts).sort())||JSON.stringify(remote.del)!=JSON.stringify(S.del);
  TS=Date.now();sset('docs',JSON.stringify(S.docs));sset('del',JSON.stringify(S.del));sset('ts',String(TS));
  if(needPush)await FB.save(u.uid,TS,pack());
  render();toast('synced')}
 catch(e){toast('sync_err')}})}
window.addEventListener('fbready',fbInit);if(window.FB)fbInit();
render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,collection,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyC3MMC-7dGU3ztshP0mYUWrV_c1Zm8njoc",authDomain:"youyou-f869f.firebaseapp.com",projectId:"youyou-f869f",storageBucket:"youyou-f869f.firebasestorage.app",messagingSenderId:"185167516974",appId:"1:185167516974:web:6d44fc5c98e63b554696bf"});
const auth=getAuth(app),db=getFirestore(app);
window.FB={
 onUser:f=>onAuthStateChanged(auth,f),
 login:()=>signInWithPopup(auth,new GoogleAuthProvider()),
 logout:()=>signOut(auth),
 async load(uid){const m=await getDoc(doc(db,'users',uid));if(!m.exists())return null;const d=m.data(),cs=await getDocs(collection(db,'users',uid,'chunks')),parts=[];
  cs.forEach(c=>{parts[+c.id]=c.data().d});return{ts:d.ts,json:parts.slice(0,d.n).join('')}},
 async save(uid,ts,json){const CH=400000,parts=[];for(let i=0;i<json.length;i+=CH)parts.push(json.slice(i,i+CH));
  const old=await getDocs(collection(db,'users',uid,'chunks')),b=writeBatch(db);
  parts.forEach((d,i)=>b.set(doc(db,'users',uid,'chunks',String(i)),{d}));
  old.forEach(c=>{if(+c.id>=parts.length)b.delete(c.ref)});
  b.set(doc(db,'users',uid),{ts,n:parts.length});await b.commit()}};
window.dispatchEvent(new Event('fbready'));
</script>
